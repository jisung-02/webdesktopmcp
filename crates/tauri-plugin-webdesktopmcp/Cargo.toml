[package]
name = "tauri-plugin-webdesktopmcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Expose your Tauri v2 app's webview WebMCP tools to external MCP clients over a loopback Streamable-HTTP endpoint."
authors = ["webdesktopmcp contributors"]
license = "MIT"
repository = "https://github.com/webdesktopmcp/webdesktopmcp"
keywords = ["tauri", "plugin", "mcp", "webmcp", "ai"]
categories = ["gui", "web-programming::http-server"]
links = "tauri-plugin-webdesktopmcp"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "6"
getrandom = "0.3"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
